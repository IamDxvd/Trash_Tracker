services:
  app:
    image: 'trashtracker-backend:latest'
    build:
      context: .
    container_name: trashtracker-app
    ports:
      - "8088:8088"
    networks:
      - trashtracker-network
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/trashtracker_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin
      - SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop
      - APP_UPLOAD_DIR=/app/uploads/reportes
      - IP_FRONTEND=http://localhost:4200,http://localhost:5173,http://localhost:3000
  db:
    image: postgres:16-alpine
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always
    container_name: trashtracker-db
    networks:
      - trashtracker-network
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=trashtracker_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trashtracker_db"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  db_data:
  uploads_data:
networks:
  trashtracker-network:
    name: trashtracker-network

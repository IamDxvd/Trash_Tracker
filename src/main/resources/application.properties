spring.application.name=trashtracker

# Base de datos PostgreSQL (ajusta host/usuario/clave segun tu entorno)
spring.datasource.url=jdbc:postgresql://localhost:5432/trashtracker_db
spring.datasource.username=postgres
spring.datasource.password=postgre
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Carga data.sql con datos de prueba DESPUES de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

server.port=8088
server.error.include-message=always
spring.jackson.serialization.fail-on-empty-beans=false

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# --- Modulo Integrante 2: Gestion Core de Reportes (HU021-HU030) ---
app.upload.dir=uploads/reportes
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Seguridad (Spring Security + JWT) ---
# Origenes del frontend permitidos por CORS (separados por coma)
ip.frontend=http://localhost:4200,http://localhost:5173,http://localhost:3000
# Clave secreta (Base64, 64 bytes) para firmar el JWT con HS512. Cambiala en produccion.
jwt.secret=lr6atYKh8yQ1JPnm+dxDnvUWLFs1vqGPWhInOxC9sQGLcW8C1RUNN60+XN5SWZfuDk/+8EBgYd7UENe9EsfXGQ==
# Duracion del token en milisegundos (1200000 = 20 min)
jwt.expiration-ms=1200000

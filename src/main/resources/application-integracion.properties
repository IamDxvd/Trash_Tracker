# Perfil opcional para una base existente: aplicar primero db/integracion-aditiva.sql.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
jwt.secret=${JWT_SECRET}
ip.frontend=${FRONTEND_ORIGIN:http://localhost:4200}
# SMTP es opcional: sin configuracion, recuperacion responde 503 sin fingir envio.
app.recovery.url=${RECOVERY_URL:}
app.recovery.from=${RECOVERY_FROM:}
# Configurar SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME,
# SPRING_MAIL_PASSWORD y SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE.
